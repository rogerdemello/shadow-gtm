name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Nightly eval regression run (03:17 UTC).
    - cron: "17 3 * * *"
  workflow_dispatch: {}

# Allow one concurrent run per ref; cancel stale ones.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # `next build` also runs the TypeScript compiler. No API keys are needed:
      # all Gemini calls happen at request time, never during the build, and
      # lib/env treats every provider key as optional.
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  eval:
    name: AI eval
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Scores the golden extraction set. With GEMINI_API_KEY set (repo secret)
      # it runs the real model and gates quality; without one it scores the
      # deterministic sample signals so the harness + scorer never silently rot.
      - name: Extraction eval
        run: npm run eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash-lite
